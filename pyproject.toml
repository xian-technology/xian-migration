[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "xian-tech-migration"
version = "0.1.0"
description = "Offline legacy Xian state migration and genesis verification"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "xian-tech-abci[vm] @ git+https://github.com/xian-technology/xian-abci@0f6bd9800c19e5463374c1225fe67a44cdd3c170",
  "xian-tech-contracting @ git+https://github.com/xian-technology/xian-contracting@6ea196ee877e1c798f2ab58c2a915fb49599c710",
  "xian-tech-accounts @ git+https://github.com/xian-technology/xian-contracting@6ea196ee877e1c798f2ab58c2a915fb49599c710#subdirectory=packages/xian-accounts",
  "xian-tech-runtime-types @ git+https://github.com/xian-technology/xian-contracting@6ea196ee877e1c798f2ab58c2a915fb49599c710#subdirectory=packages/xian-runtime-types",
  "xian-tech-compiler-core @ git+https://github.com/xian-technology/xian-contracting@6ea196ee877e1c798f2ab58c2a915fb49599c710#subdirectory=packages/xian-compiler-core",
  "xian-tech-vm-core @ git+https://github.com/xian-technology/xian-contracting@6ea196ee877e1c798f2ab58c2a915fb49599c710#subdirectory=packages/xian-vm-core",
]

[project.scripts]
xian-legacy-genesis = "xian_migration.cli:main"

[project.urls]
Repository = "https://github.com/xian-technology/xian-migration"

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=7.1.0,<8", "ruff>=0.15.12,<0.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.uv]
no-sources = true

[tool.coverage.run]
patch = ["subprocess"]
