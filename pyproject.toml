[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "xian-tech-migration"
version = "0.1.0"
description = "Offline legacy Xian state migration and genesis verification"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "xian-tech-abci[vm] @ git+https://github.com/xian-technology/xian-abci@8cd5231fa64d2a2f66ee5d20442e1f66ab9e3131",
  "xian-tech-contracting @ git+https://github.com/xian-technology/xian-contracting@48166d30165a09ff350bab31c27b164fb637bf07",
  "xian-tech-accounts @ git+https://github.com/xian-technology/xian-contracting@48166d30165a09ff350bab31c27b164fb637bf07#subdirectory=packages/xian-accounts",
  "xian-tech-runtime-types @ git+https://github.com/xian-technology/xian-contracting@48166d30165a09ff350bab31c27b164fb637bf07#subdirectory=packages/xian-runtime-types",
  "xian-tech-compiler-core @ git+https://github.com/xian-technology/xian-contracting@48166d30165a09ff350bab31c27b164fb637bf07#subdirectory=packages/xian-compiler-core",
  "xian-tech-vm-core @ git+https://github.com/xian-technology/xian-contracting@48166d30165a09ff350bab31c27b164fb637bf07#subdirectory=packages/xian-vm-core",
]

[project.scripts]
xian-legacy-genesis = "xian_migration.cli:main"

[project.urls]
Repository = "https://github.com/xian-technology/xian-migration"

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=7.1.0,<8", "ruff>=0.15.12,<0.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.uv]
no-sources = true

[tool.coverage.run]
patch = ["subprocess"]
