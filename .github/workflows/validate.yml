name: Validate migration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xian-migration
    env:
      XIAN_MIGRATION_CONTRACTS_DIR: ${{ github.workspace }}/xian-configs/contracts
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@v7
        with:
          path: xian-migration
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Read configuration pin
        id: pins
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('runtime-manifest.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('configs=' + manifest['repos']['xian-configs']['commit'], file=output)
          PY
      - uses: actions/checkout@v7
        with:
          repository: xian-technology/xian-configs
          ref: ${{ steps.pins.outputs.configs }}
          path: xian-configs
      - name: Install tools
        run: |
          python -m pip install uv==0.13.6
          rustup show
      - name: Validate pinned migration tool
        run: ./scripts/validate.sh
      - name: Record resolved inputs
        if: always()
        run: |
          cat runtime-manifest.json >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git -C ../xian-configs rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
